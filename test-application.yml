trigger: none

pool:
  vmImage: 'ubuntu-latest'

# jobs:
#   - job: Build
#     variables:
#       environment: Dev

#     steps:
#       - script: echo "Building for $(environment)"

#   - job: Test
#     steps:

jobs:
  - job: Build
    steps:
      - script: |
          echo "##vso[task.setvariable variable=environment;isOutput=true]Dev"
        name: SetEnvironment

  - job: Test
    dependsOn: Build
    variables:
      environment: $[ dependencies.Build.outputs['SetEnvironment.environment'] ]

    steps:
      - script: echo "Environment is $(environment)"

