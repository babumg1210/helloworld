jobs:
  - job: Build
    steps:
      - script: |
          echo "##vso[task.setvariable variable=environment;isOutput=true]Dev"
          echo "##vso[task.setvariable variable=application;isOutput=true]web"
        name: SetEnvironment

  - job: Test
    dependsOn: Build
    variables:
      environment: $[ dependencies.Build.outputs['SetEnvironment.environment'] ]
      application: $[ dependencies.Build.outputs['SetEnvironment.application'] ]

    steps:
      - script: echo "Environment is $(environment)"
      - script: echo "Deploy the application $(application)"

